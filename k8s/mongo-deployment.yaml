apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookstore-mongo
  template:
    metadata:
      labels:
        app: bookstore-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-pvc
