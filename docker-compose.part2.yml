services:
  app:
    container_name: bookstore-app-p2
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm run install:all && npm run build && npm start --prefix Backend"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo-p2:27017/hogwarts_bookstore
      PORT: 5000
      NODE_ENV: development
      UPLOAD_DIR: /workspace/Backend/public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-junaidiqbalpro19@gmail.com}
    depends_on:
      - mongo
    ports:
      - "${PART2_APP_PORT:-5001}:5000"
    volumes:
      - ./:/workspace
      - root_node_modules_p2:/workspace/node_modules
      - backend_node_modules_p2:/workspace/Backend/node_modules
      - frontend_node_modules_p2:/workspace/Frontend/node_modules
      - uploads_data_p2:/workspace/Backend/public
    restart: unless-stopped

  mongo:
    container_name: mongo-p2
    image: mongo:7
    volumes:
      - mongo_data_p2:/data/db
    restart: unless-stopped

volumes:
  mongo_data_p2:
  uploads_data_p2:
  root_node_modules_p2:
  backend_node_modules_p2:
  frontend_node_modules_p2:
